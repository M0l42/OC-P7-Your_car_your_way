server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: chat-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chat}
    username: ${DB_USER:chat}
    password: ${DB_PASSWORD:chat}
  flyway:
    locations: classpath:db/migration

chat:
  # Shown in the instance badge (CONNECTED instance-id header) and /actuator/info; chat-1 / chat-2 in compose.
  instance-id: ${INSTANCE_ID:local}
  # A7: browser Origins accepted on /ws (comma-separated); a missing Origin is accepted.
  allowed-origins: ${CHAT_ALLOWED_ORIGINS:http://localhost:8080}
  jwt:
    # Issuer's RS256 public key, X.509 SPKI PEM (compose: dev key from the jwt-keys volume). Required.
    public-key-location: ${CHAT_JWT_PUBLIC_KEY_LOCATION:}
    issuer: ${CHAT_JWT_ISSUER:ycyw-auth-stub}
    audience: ${CHAT_JWT_AUDIENCE:ycyw-chat}
  listener:
    # Dedicated LISTEN connection, separate from the Hikari pool (F9). Compose points chat-2's at
    # toxiproxy in the O10 region variant. Blank → the pool's URL (and always the pool's credentials).
    jdbc-url: ${CHAT_LISTENER_JDBC_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # Ready only while LISTEN chat_events is active (A3, O1; ListenerReadiness).
          include: readinessState,listener
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  instance-id: ${chat.instance-id}
