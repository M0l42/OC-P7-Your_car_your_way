# Standalone SPA config (image default). The compose stack replaces it with infra/nginx.conf.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
