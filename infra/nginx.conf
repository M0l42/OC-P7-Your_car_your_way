# nginx stands in for the AWS ALB (round-robin across chat instances) and serves chat-web.
# Mounted as /etc/nginx/conf.d/default.conf (http context) in the nginx service.

# Docker's embedded DNS. Upstream servers flagged `resolve` are re-resolved every 5 s, so a
# restarted container that gets a new IP receives traffic again (O3; OSS nginx >= 1.27.3).
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream chat {
    zone chat 64k;
    server chat-1:8080 resolve;
    server chat-2:8080 resolve;
}

# Demo-only pins for the FIRST connection (C5): /ws-a -> chat-1, /ws-b -> chat-2.
upstream chat_a {
    zone chat_a 64k;
    server chat-1:8080 resolve;
}
upstream chat_b {
    zone chat_b 64k;
    server chat-2:8080 resolve;
}

upstream auth_stub {
    zone auth_stub 64k;
    server auth-stub:8080 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Access log shows which instance served each request (`make logs S=nginx` during the kill demo).
log_format upstreamlog '$remote_addr [$time_local] "$request" $status '
                       'upstream=$upstream_addr upstream_status=$upstream_status rt=$request_time';

server {
    listen 8080;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log upstreamlog;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    # A handshake or GET hitting a not-ready instance (503) or a dead one is retried on the other
    # instance. POST is never retried (non_idempotent is not set).
    proxy_next_upstream error timeout http_503;
    proxy_next_upstream_tries 2;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # STOMP over WebSocket, round-robin. Long idle timeout like the ALB (STOMP heartbeats keep it alive).
    location /ws {
        proxy_pass http://chat;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Demo-only: pinned first connection; every reconnect uses /ws.
    location /ws-a {
        rewrite ^/ws-a(.*)$ /ws$1 break;
        proxy_pass http://chat_a;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location /ws-b {
        rewrite ^/ws-b(.*)$ /ws$1 break;
        proxy_pass http://chat_b;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://chat;
    }

    # Probes only (round-robin), used by the chaos client and smoke checks. Everything else under
    # /actuator is not exposed.
    location ~ ^/actuator/(health(/.*)?|info)$ {
        proxy_pass http://chat;
    }
    location /actuator {
        return 404;
    }

    # Dev-only token issuer standing in for the monolith.
    location /dev/tokens {
        proxy_pass http://auth_stub;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
